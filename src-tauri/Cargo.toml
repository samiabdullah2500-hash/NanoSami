[package]
name = "nanosami"
version = "0.3.0"
description = "NanoSami — Materials Science & Nanotechnology Toolkit"
authors = ["Sami Abdullah Mohammed"]
license = "MIT"
repository = "https://github.com/samiabdullah2500-hash/NanoSami"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nanosami_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
